<script src="./stocks.js"></script>

<script>

/* =========================================
   IDXNOVA API CONFIG
========================================= */

const API_BASE =
  "https://idxnova-api.rendyalterio22.workers.dev";


const STOCK_API =
  API_BASE + "/api/stocks";


const FUNDAMENTAL_API =
  API_BASE + "/api/fundamental";


/* =========================================
   AMBIL TICKER DARI URL

   Contoh:
   stock.html?ticker=BBRI
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const ticker =
  (params.get("ticker") || "")
    .trim()
    .toUpperCase();


/* =========================================
   MENU MOBILE
========================================= */

function toggleMenu() {

  document
    .getElementById("navMenu")
    .classList
    .toggle("active");

}


/* =========================================
   FORMAT HARGA
========================================= */

function formatPrice(price) {

  const value =
    Number(price);


  if (
    !Number.isFinite(value) ||
    value <= 0
  ) {

    return "-";

  }


  return "Rp" +
    value.toLocaleString("id-ID");

}


/* =========================================
   FORMAT RUPIAH
========================================= */

function formatRupiah(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "Data belum tersedia";

  }


  const number =
    Number(value);


  if (!Number.isFinite(number)) {

    return String(value);

  }


  return "Rp" +
    number.toLocaleString(
      "id-ID",
      {
        maximumFractionDigits: 2
      }
    );

}


/* =========================================
   SAFE NUMBER
========================================= */

function safeNumber(value) {

  const number =
    Number(value);


  return Number.isFinite(number)
    ? number
    : 0;

}


/* =========================================
   SAFE SCORE 0 - 100
========================================= */

function safeScore(value) {

  return Math.min(
    100,
    Math.max(
      0,
      Math.round(
        safeNumber(value)
      )
    )
  );

}


/* =========================================
   SET TEXT AMAN
========================================= */

function setText(id, value) {

  const element =
    document.getElementById(id);


  if (element) {

    element.textContent =
      value;

  }

}


/* =========================================
   OUTLOOK BERDASARKAN SCORE
========================================= */

function getOutlook(score) {

  const value =
    safeScore(score);


  if (value >= 85) {

    return "Sangat Kuat";

  }


  if (value >= 75) {

    return "Positif";

  }


  if (value >= 60) {

    return "Netral Positif";

  }


  if (value >= 45) {

    return "Netral";

  }


  return "Perlu Perhatian";

}


/* =========================================
   RISK BERDASARKAN SCORE
========================================= */

function getRisk(score) {

  const value =
    safeScore(score);


  if (value >= 85) {

    return "Low";

  }


  if (value >= 70) {

    return "Moderate";

  }


  if (value >= 55) {

    return "Moderate - High";

  }


  return "High";

}


/* =========================================
   VALUATION
========================================= */

function getValuation(score) {

  const value =
    safeScore(score);


  if (value >= 85) {

    return "Attractive";

  }


  if (value >= 70) {

    return "Fair";

  }


  if (value >= 55) {

    return "Neutral";

  }


  return "Data Pending";

}


/* =========================================
   CARI BEST FIT
========================================= */

function getBestFit(stock) {

  const scores = [

    {
      name: "Trading",
      value: safeScore(stock.trading)
    },

    {
      name: "Swing",
      value: safeScore(stock.swing)
    },

    {
      name: "Medium Term",
      value: safeScore(stock.medium)
    },

    {
      name: "Long Term",
      value: safeScore(stock.long)
    }

  ];


  scores.sort(
    function(a, b) {

      return b.value - a.value;

    }
  );


  return scores[0].name;

}


/* =========================================
   FORMAT PERSEN
========================================= */

function formatPercent(value) {

  if (
    value === "-" ||
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "Data belum tersedia";

  }


  const number =
    Number(value);


  if (!Number.isFinite(number)) {

    return String(value);

  }


  return number.toFixed(2) + "%";

}


/* =========================================
   AMBIL VALUE FUNDAMENTAL

   Mendukung:
   result.fundamental
   result.data
   result langsung
========================================= */

function extractFundamental(result) {

  if (!result) {

    return {};

  }


  if (
    result.fundamental &&
    typeof result.fundamental === "object"
  ) {

    return result.fundamental;

  }


  if (
    result.data &&
    result.data.fundamental &&
    typeof result.data.fundamental === "object"
  ) {

    return result.data.fundamental;

  }


  if (
    result.data &&
    typeof result.data === "object" &&
    !Array.isArray(result.data)
  ) {

    return result.data;

  }


  return result;

}


/* =========================================
   NORMALISASI DATA SAHAM
========================================= */

function normalizeStock(stock) {

  const overall =
    safeScore(stock.overall);


  const trading =
    safeScore(stock.trading);


  const swing =
    safeScore(stock.swing);


  const medium =
    safeScore(stock.medium);


  const long =
    safeScore(stock.long);


  return {

    ticker:
      String(
        stock.ticker ||
        stock.StockCode ||
        ""
      ).toUpperCase(),


    name:
      stock.name ||
      stock.StockName ||
      "-",


    sector:
      stock.sector ||
      stock.Sector ||
      "IDX Listed Company",


    price:
      stock.price ??
      stock.LastPrice ??
      stock.Close ??
      stock.close ??
      0,


    change:
      stock.change ??
      stock.Change ??
      stock.changePercent ??
      stock.ChangePercent ??
      0,


    overall:
      overall,


    trading:
      trading,


    swing:
      swing,


    medium:
      medium,


    long:
      long,


    bestFit:
      stock.bestFit ||
      getBestFit({
        trading: trading,
        swing: swing,
        medium: medium,
        long: long
      }),


    label:
      stock.label ||
      getOutlook(overall),


    risk:
      stock.risk ||
      getRisk(overall),


    valuation:
      stock.valuation ||
      getValuation(overall),


    tradingOutlook:
      stock.tradingOutlook ||
      getOutlook(trading),


    swingOutlook:
      stock.swingOutlook ||
      getOutlook(swing),


    mediumOutlook:
      stock.mediumOutlook ||
      getOutlook(medium),


    longOutlook:
      stock.longOutlook ||
      getOutlook(long),


    revenueGrowth:
      stock.revenueGrowth ??
      "-",


    profitGrowth:
      stock.profitGrowth ??
      "-",


    roe:
      stock.roe ??
      "-",


    debtLevel:
      stock.debtLevel ??
      "-",


    dividend:
      stock.dividend ??
      "-",


    businessQuality:
      stock.businessQuality ??
      getOutlook(long)

  };

}


/* =========================================
   TAMPILKAN ERROR
========================================= */

function showError(message) {

  setText(
    "stockSector",
    "DATA NOT FOUND"
  );


  document
    .getElementById("stockTicker")
    .innerHTML =
    "Saham <span>Tidak Ditemukan</span>";


  setText(
    "stockName",
    message ||
    "Ticker tidak tersedia dalam database IDXNOVA."
  );


  setText(
    "stockBestFit",
    "-"
  );


  setText(
    "stockLabel",
    "ERROR"
  );


  setText(
    "dataMode",
    "ERROR"
  );


  setText(
    "dataNote",
    "Data saham tidak dapat dimuat."
  );

}


/* =========================================
   RENDER SAHAM KE HALAMAN
========================================= */

function renderStock(rawStock, mode) {

  const stock =
    normalizeStock(rawStock);


  if (!stock.ticker) {

    showError();

    return;

  }


  document.title =
    stock.ticker +
    " | IDXNOVA";


  setText(
    "stockSector",
    stock.sector
  );


  document
    .getElementById("stockTicker")
    .innerHTML =
    stock.ticker +
    " <span>Analysis</span>";


  setText(
    "stockName",
    stock.name
  );


  setText(
    "stockBestFit",
    stock.bestFit
  );


  setText(
    "stockLabel",
    stock.label
  );


  document
    .getElementById("stockOverall")
    .innerHTML =
    stock.overall +
    "<span>/100</span>";


  document
    .getElementById("stockOverallBar")
    .style.width =
    stock.overall + "%";


  setText(
    "stockRisk",
    stock.risk
  );


  setText(
    "stockValuation",
    stock.valuation
  );


  setText(
    "stockPrice",
    formatPrice(stock.price)
  );


  const change =
    safeNumber(stock.change);


  const changeElement =
    document.getElementById(
      "stockChange"
    );


  if (changeElement) {

    changeElement.textContent =
      (change >= 0 ? "▲ +" : "▼ ") +
      Math.abs(change).toFixed(2) +
      "%";


    changeElement.className =
      change >= 0
        ? "positive"
        : "negative";

  }


  setText(
    "stockTrading",
    stock.trading + "/100"
  );


  setText(
    "stockSwing",
    stock.swing + "/100"
  );


  setText(
    "stockMedium",
    stock.medium + "/100"
  );


  setText(
    "tradingOutlook",
    stock.tradingOutlook
  );


  setText(
    "tradingScore",
    stock.trading + " / 100"
  );


  const tradingBar =
    document.getElementById(
      "tradingBar"
    );


  if (tradingBar) {

    tradingBar.style.width =
      stock.trading + "%";

  }


  setText(
    "swingOutlook",
    stock.swingOutlook
  );


  setText(
    "swingScore",
    stock.swing + " / 100"
  );


  const swingBar =
    document.getElementById(
      "swingBar"
    );


  if (swingBar) {

    swingBar.style.width =
      stock.swing + "%";

  }


  setText(
    "mediumOutlook",
    stock.mediumOutlook
  );


  setText(
    "mediumScore",
    stock.medium + " / 100"
  );


  const mediumBar =
    document.getElementById(
      "mediumBar"
    );


  if (mediumBar) {

    mediumBar.style.width =
      stock.medium + "%";

  }


  setText(
    "longOutlook",
    stock.longOutlook
  );


  setText(
    "longScore",
    stock.long + " / 100"
  );


  const longBar =
    document.getElementById(
      "longBar"
    );


  if (longBar) {

    longBar.style.width =
      stock.long + "%";

  }


  /* =====================================
     FUNDAMENTAL
  ===================================== */

  setText(
    "revenueGrowth",
    formatPercent(stock.revenueGrowth)
  );


  setText(
    "profitGrowth",
    formatPercent(stock.profitGrowth)
  );


  setText(
    "stockRoe",
    formatPercent(stock.roe)
  );


  setText(
    "debtLevel",
    stock.debtLevel ||
    "Data belum tersedia"
  );


  setText(
    "stockDividend",
    stock.dividend ||
    "Data belum tersedia"
  );


  setText(
    "businessQuality",
    stock.businessQuality ||
    "Data belum tersedia"
  );


  /* =====================================
     STATUS DATA
  ===================================== */

  setText(
    "dataMode",
    mode === "API"
      ? "LIVE API"
      : "FALLBACK"
  );


  setText(
    "dataNote",
    mode === "API"
      ? "Market dan fundamental dimuat dari IDXNOVA API."
      : "API tidak tersedia — menggunakan database cadangan."
  );


  /* =====================================
     CTA
  ===================================== */

  setText(
    "ctaTitle",
    stock.ticker +
    ". Analyze Before You Act."
  );


  setText(
    "ctaText",
    "Analisis " +
    stock.ticker +
    " berdasarkan data yang tersedia di IDXNOVA. Selalu lakukan riset tambahan sebelum mengambil keputusan investasi atau trading."
  );

}


/* =========================================
   AMBIL DATA FUNDAMENTAL

   Mencoba beberapa format URL agar
   kompatibel dengan endpoint Worker:
   
   /api/fundamental?ticker=BBRI
   /api/fundamental/BBRI
========================================= */

async function fetchFundamentalData() {

  const urls = [

    FUNDAMENTAL_API +
    "?ticker=" +
    encodeURIComponent(ticker),

    FUNDAMENTAL_API +
    "/" +
    encodeURIComponent(ticker)

  ];


  let lastError = null;


  for (const url of urls) {

    try {

      const response =
        await fetch(
          url,
          {
            method: "GET",

            headers: {
              "Accept":
                "application/json"
            }
          }
        );


      if (!response.ok) {

        throw new Error(
          "Fundamental HTTP " +
          response.status
        );

      }


      const result =
        await response.json();


      if (
        result.status &&
        result.status !== "success"
      ) {

        throw new Error(
          "Fundamental API status error"
        );

      }


      const fundamental =
        extractFundamental(result);


      if (
        fundamental &&
        typeof fundamental === "object"
      ) {

        console.log(
          "Fundamental connected:",
          url,
          fundamental
        );


        return fundamental;

      }

    } catch (error) {

      lastError =
        error;


      console.warn(
        "Fundamental URL gagal:",
        url,
        error
      );

    }

  }


  throw (
    lastError ||
    new Error(
      "Fundamental API gagal"
    )
  );

}


/* =========================================
   LOAD SAHAM
========================================= */

async function loadStock() {


  /* =====================================
     TICKER KOSONG
  ===================================== */

  if (!ticker) {

    showError(
      "Ticker saham tidak ditemukan pada alamat halaman."
    );

    return;

  }


  try {


    /* =====================================
       MARKET API
  ===================================== */

    const marketResponse =
      await fetch(
        STOCK_API,
        {
          method: "GET",

          headers: {
            "Accept":
              "application/json"
          }
        }
      );


    if (!marketResponse.ok) {

      throw new Error(
        "Market API HTTP " +
        marketResponse.status
      );

    }


    const marketResult =
      await marketResponse.json();


    if (
      marketResult.status !== "success" ||
      !Array.isArray(
        marketResult.data
      )
    ) {

      throw new Error(
        "Format Market API tidak valid"
      );

    }


    /* =====================================
       CARI MARKET DATA BERDASARKAN TICKER
  ===================================== */

    const marketStock =
      marketResult.data.find(
        function(stock) {

          const stockTicker =
            String(
              stock.ticker ||
              stock.StockCode ||
              ""
            )
            .trim()
            .toUpperCase();


          return stockTicker === ticker;

        }
      );


    if (!marketStock) {

      throw new Error(
        "Ticker " +
        ticker +
        " tidak ditemukan di Market API"
      );

    }


    /* =====================================
       FALLBACK STOCKS.JS
  ===================================== */

    const fallbackStock =
      typeof STOCKS !== "undefined" &&
      STOCKS &&
      STOCKS[ticker]
        ? STOCKS[ticker]
        : {};


    /* =====================================
       FUNDAMENTAL API

       Gagal fundamental TIDAK membuat
       market data ikut gagal.
  ===================================== */

    let fundamentalStock =
      {};


    try {

      fundamentalStock =
        await fetchFundamentalData();

    } catch (fundamentalError) {

      console.warn(
        "Fundamental belum dapat dimuat:",
        fundamentalError
      );

    }


    /* =====================================
       NORMALISASI FUNDAMENTAL

       Mendukung struktur:
       result.fundamental
       result.data.fundamental
       result.data
       langsung
  ===================================== */

    const fundamental =
      extractFundamental(
        fundamentalStock
      );


    /* =====================================
       GABUNGKAN SEMUA DATA

       PRIORITAS:
       1. Market API untuk harga
       2. Fundamental API untuk fundamental
       3. stocks.js sebagai cadangan
  ===================================== */

    const mergedStock = {


      /* ---------------------------------
         DATABASE CADANGAN
      --------------------------------- */

      ...fallbackStock,


      /* ---------------------------------
         MARKET API
      --------------------------------- */

      ...marketStock,


      /* ---------------------------------
         IDENTITAS
      --------------------------------- */

      ticker:
        marketStock.ticker ||
        fallbackStock.ticker ||
        ticker,


      name:
        marketStock.name ||
        fallbackStock.name ||
        fundamental.name ||
        fundamental.companyName ||
        "-",


      sector:
        marketStock.sector ||
        fallbackStock.sector ||
        fundamental.sector ||
        "IDX Listed Company",


      /* ---------------------------------
         HARGA MARKET
      --------------------------------- */

      price:
        safeNumber(
          marketStock.price
        ) > 0
          ? marketStock.price
          : (
            fallbackStock.price ??
            0
          ),


      change:
        marketStock.change !== undefined &&
        marketStock.change !== null
          ? marketStock.change
          : (
            fallbackStock.change ??
            0
          ),


      /* ---------------------------------
         SCORE
      --------------------------------- */

      overall:
        safeNumber(
          marketStock.overall
        ) > 0
          ? marketStock.overall
          : (
            fallbackStock.overall ??
            0
          ),


      trading:
        safeNumber(
          marketStock.trading
        ) > 0
          ? marketStock.trading
          : (
            fallbackStock.trading ??
            0
          ),


      swing:
        safeNumber(
          marketStock.swing
        ) > 0
          ? marketStock.swing
          : (
            fallbackStock.swing ??
            0
          ),


      medium:
        safeNumber(
          marketStock.medium
        ) > 0
          ? marketStock.medium
          : (
            fallbackStock.medium ??
            0
          ),


      long:
        safeNumber(
          marketStock.long
        ) > 0
          ? marketStock.long
          : (
            fallbackStock.long ??
            0
          ),


      /* =================================
         FUNDAMENTAL API PRIORITAS
      ================================= */

      revenueGrowth:
        fundamental.revenueGrowth ??
        fundamental.revenue_growth ??
        fallbackStock.revenueGrowth ??
        "-",


      profitGrowth:
        fundamental.profitGrowth ??
        fundamental.profit_growth ??
        fallbackStock.profitGrowth ??
        "-",


      roe:
        fundamental.roe ??
        fundamental.ROE ??
        fallbackStock.roe ??
        "-",


      debtLevel:
        fundamental.debtLevel ??
        fundamental.debt_level ??
        (
          fundamental.debtToEquity !== null &&
          fundamental.debtToEquity !== undefined
            ? "D/E " +
              Number(
                fundamental.debtToEquity
              ).toFixed(2) +
              "x"
            : (
              fallbackStock.debtLevel ??
              "Data belum tersedia"
            )
        ),


      dividend:
        fundamental.dividend ??
        (
          fundamental.dividendYield !== null &&
          fundamental.dividendYield !== undefined
            ? Number(
                fundamental.dividendYield
              ).toFixed(2) +
              "%"
            : (
              fallbackStock.dividend ??
              "Data belum tersedia"
            )
        ),


      businessQuality:
        fundamental.businessQuality ??
        fundamental.business_quality ??
        fallbackStock.businessQuality ??
        "-",


      /* =================================
         DATA FUNDAMENTAL TAMBAHAN
         Disimpan untuk pengembangan
         halaman selanjutnya
      ================================= */

      fundamentalScore:
        fundamental.fundamentalScore ??
        null,


      roa:
        fundamental.roa ??
        null,


      grossMargin:
        fundamental.grossMargin ??
        null,


      netMargin:
        fundamental.netMargin ??
        null,


      debtToEquity:
        fundamental.debtToEquity ??
        null,


      currentRatio:
        fundamental.currentRatio ??
        null,


      pe:
        fundamental.pe ??
        null,


      pb:
        fundamental.pb ??
        null,


      ps:
        fundamental.ps ??
        null,


      dividendYield:
        fundamental.dividendYield ??
        null,


      dividendPerShare:
        fundamental.dividendPerShare ??
        null,


      eps:
        fundamental.eps ??
        null,


      bvps:
        fundamental.bvps ??
        null,


      revenue:
        fundamental.revenue ??
        null,


      netIncome:
        fundamental.netIncome ??
        null,


      grossProfit:
        fundamental.grossProfit ??
        null,


      lastUpdated:
        fundamental.lastUpdated ??
        null,


      /* =================================
         ANALYSIS TEXT
      ================================= */

      bestFit:
        marketStock.bestFit ||
        fallbackStock.bestFit ||
        "",


      label:
        marketStock.label ||
        fallbackStock.label ||
        "",


      risk:
        marketStock.risk ||
        fallbackStock.risk ||
        "",


      valuation:
        marketStock.valuation ||
        fallbackStock.valuation ||
        "",


      tradingOutlook:
        marketStock.tradingOutlook ||
        fallbackStock.tradingOutlook ||
        "",


      swingOutlook:
        marketStock.swingOutlook ||
        fallbackStock.swingOutlook ||
        "",


      mediumOutlook:
        marketStock.mediumOutlook ||
        fallbackStock.mediumOutlook ||
        "",


      longOutlook:
        marketStock.longOutlook ||
        fallbackStock.longOutlook ||
        ""

    };


    /* =====================================
       RENDER
    ===================================== */

    renderStock(
      mergedStock,
      "API"
    );


    console.log(
      "================================="
    );


    console.log(
      "IDXNOVA SUCCESS:",
      ticker
    );


    console.log(
      "Market Data:",
      marketStock
    );


    console.log(
      "Fundamental Data:",
      fundamental
    );


    console.log(
      "Fallback Data:",
      fallbackStock
    );


    console.log(
      "Merged Data:",
      mergedStock
    );


    console.log(
      "================================="
    );


  } catch (error) {


    console.error(
      "IDXNOVA API gagal:",
      error
    );


    /* =====================================
       JIKA MARKET API GAGAL
       GUNAKAN STOCKS.JS
    ===================================== */

    if (
      typeof STOCKS !== "undefined" &&
      STOCKS &&
      STOCKS[ticker]
    ) {

      renderStock(
        STOCKS[ticker],
        "FALLBACK"
      );


    } else {

      showError(
        "Ticker " +
        ticker +
        " tidak ditemukan atau IDXNOVA API sedang tidak dapat dihubungi."
      );

    }

  }

}


/* =========================================
   JALANKAN
========================================= */

loadStock();

</script>
